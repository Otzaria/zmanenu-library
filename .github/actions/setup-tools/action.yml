name: Setup builder and Otzaria tools
description: >
  Checks out Otzaria/otzaria at the pinned ref (otzaria-tools.ref, or the given
  ref) into .otzaria, installs Flutter and resolves both packages.
inputs:
  otzaria-ref:
    description: Commit/tag/branch of Otzaria/otzaria; empty = otzaria-tools.ref
    required: false
    default: ''
  flutter-version:
    description: Flutter version the app builds with
    required: false
    default: 3.47.7
outputs:
  otzaria-dir:
    description: Absolute path of the Otzaria checkout
    value: ${{ steps.ref.outputs.dir }}
runs:
  using: composite
  steps:
    - id: ref
      shell: bash
      run: |
        ref="${{ inputs.otzaria-ref }}"
        [ -n "$ref" ] || ref="$(tr -d '[:space:]' < otzaria-tools.ref)"
        echo "ref=$ref" >> "$GITHUB_OUTPUT"
        echo "dir=$GITHUB_WORKSPACE/.otzaria" >> "$GITHUB_OUTPUT"
        echo "Otzaria tools from Otzaria/otzaria@$ref"

    - uses: actions/checkout@v7.0.1
      with:
        repository: Otzaria/otzaria
        ref: ${{ steps.ref.outputs.ref }}
        path: .otzaria
        fetch-depth: 1
        persist-credentials: false

    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ inputs.flutter-version }}
        cache: true

    - name: Install zstd
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd libzstd1

    - name: Resolve Otzaria packages
      shell: bash
      working-directory: .otzaria
      run: flutter pub get --enforce-lockfile

    - name: Resolve builder packages
      shell: bash
      working-directory: builder
      run: dart pub get
