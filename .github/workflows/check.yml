# בנייה ואימות בלי פרסום: לכל push ו-PR, וגם ידנית.
name: Check

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      otzaria_ref:
        description: Otzaria/otzaria ref for the tools (empty = otzaria-tools.ref)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # A PR from a branch of this repository is already checked by its push.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: tools
        uses: ./.github/actions/setup-tools
        with:
          otzaria-ref: ${{ inputs.otzaria_ref }}

      - name: Builder tests
        working-directory: builder
        run: |
          dart analyze --fatal-infos
          dart test

      - name: Signer analysis
        working-directory: signer
        run: |
          dart pub get --enforce-lockfile
          dart analyze --fatal-infos

      - name: Build the library and the examples
        run: |
          cd builder
          dart run bin/zmanenu.dart build --source ../source --library ../library.json \
            --out "$RUNNER_TEMP/library" --db-version 1
          dart run bin/zmanenu.dart build --source test/fixtures/examples --library ../library.json \
            --out "$RUNNER_TEMP/examples" --db-version 1

      - name: Validate with the Otzaria validator
        env:
          OTZARIA_DIR: ${{ steps.tools.outputs.otzaria-dir }}
        run: |
          db="$(python3 -c 'import json; print(json.load(open("library.json"))["db_file_name"])')"
          dbs=("$RUNNER_TEMP/library/$db")
          dbs+=("$RUNNER_TEMP/examples/$db")
          bash scripts/otzaria-tools.sh validate "${dbs[@]}"
